
<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>
<body>
    <h1>Digital Clock!</h1>
    <h2 id="time"></h2>

    <script>
        function display() {
            var d = new Date();

            var h = d.getHours();
            var m = d.getMinutes();
            var s = d.getSeconds();

            document.getElementById("time").innerHTML =
                h + ":" + m + ":" + s;
        }

        display();
        setInterval(display, 1000);
    </script>
</body>
</html>
