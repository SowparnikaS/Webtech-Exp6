
<!DOCTYPE html>
<html>
<head>
    <title>Move Car</title>
</head>
<body onload="init()">
    <h1>Move the Car</h1>

    <img id="img" src="car.png" width="150" alt="Car image">

    <br><br>

    <button onclick="moveRight()">Move</button>
    <button onclick="stop()">Stop</button>

    <script>
        var imgObj;
        var animate;

        function init() {
            imgObj = document.getElementById("img");
            imgObj.style.position = "relative";
            imgObj.style.left = "0px";
        }

        function moveRight() {
            clearTimeout(animate);

            function move() {
                imgObj.style.left =
                    parseInt(imgObj.style.left) + 1 + "px";

                animate = setTimeout(move, 10);
            }

            move();
        }

        function stop() {
            clearTimeout(animate);
        }
    </script>
</body>
</html>
